# Local development stack. NOT a production topology.
# Production runs on AWS af-south-1 (RDS Postgres + S3 + KMS).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kamano
      POSTGRES_PASSWORD: kamano
      POSTGRES_DB: kamano
    ports:
      - "5432:5432"
    volumes:
      - kamano_pgdata:/var/lib/postgresql/data
      - ../supabase/migrations:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://kamano:kamano@db:5432/kamano
      DATA_REGION: af-south-1
      ENFORCE_DATA_RESIDENCY: "true"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  kamano_pgdata:
